services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ana
      POSTGRES_USER: ana
      POSTGRES_PASSWORD: ana
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ana -d ana"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ana_postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      ANA_ENVIRONMENT: local
      ANA_LOG_LEVEL: INFO
      ANA_DATABASE_URL: postgresql+psycopg://ana:ana@db:5432/ana
      ANA_CORS_ORIGINS: http://localhost:5173
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn ana.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  redis:
    image: redis:8-alpine
    profiles: ["cache"]
    ports:
      - "6379:6379"

volumes:
  ana_postgres:
